# Cap Offline — 构建时冒烟测试 Docker Compose
# 仅用于 smoke-test.sh，不在生产环境使用。
#
# 本测试使用宿主机上由 mock-redis-cluster.sh 启动的 Redis 集群。
# REDIS_CLUSTER_HOST 由 smoke-test.sh 在运行时自动检测并注入。

services:
  cap:
    image: cap-offline:${VERSION:-3.1.0}
    ports:
      - "${TEST_PORT:-13000}:3000"
    environment:
      ADMIN_KEY: test_admin_key_for_smoke
      REDIS_CLUSTER_URLS: redis://${REDIS_CLUSTER_HOST}:17000,redis://${REDIS_CLUSTER_HOST}:17001,redis://${REDIS_CLUSTER_HOST}:17002
      BASE_PATH: /cap
      SHOW_ERRORS: "true"
      HIDE_RATELIMIT_IP_WARNING: "true"
    restart: "no"
