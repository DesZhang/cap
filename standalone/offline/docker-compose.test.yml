# Cap Offline — 构建时冒烟测试 Docker Compose
# 仅用于 smoke-test.sh，不在生产环境使用。

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cap:
    image: cap-offline:${VERSION:-3.1.0}
    ports:
      - "${TEST_PORT:-13000}:3000"
    environment:
      ADMIN_KEY: test_admin_key_for_smoke
      REDIS_URL: redis://redis:6379
      BASE_PATH: /cap
      SHOW_ERRORS: "true"
      HIDE_RATELIMIT_IP_WARNING: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"
